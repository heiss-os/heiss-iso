name: core

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    name: heiss-core unit tests and manifest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s core/tests -v
      - run: python3 -m unittest discover -s helper/tests -v
      - run: python3 -m unittest discover -s welcome/tests -v
      - run: python3 -m unittest discover -s control/tests -v
      - name: Qt glue at least compiles (PySide6 is not installed in CI)
        run: python3 -m py_compile welcome/heiss_welcome/app.py welcome/heiss_welcome/__main__.py control/heiss_control/app.py control/heiss_control/__main__.py control/data/heiss-control
      - name: Generated metapackage files are up to date
        run: python3 scripts/gen-profile-packages.py --check
      - name: Manifests load and validate
        run: python3 -m heiss_core --profiles profiles profile list
        env:
          PYTHONPATH: core

  packages-exist:
    name: every manifest package exists (pacman -Si)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm python git
      - uses: actions/checkout@v4
      - run: python3 scripts/check-packages.py
      - name: ISO package list is valid
        run: python3 scripts/check-iso-packages.py
      - name: File associations point to Base apps that really ship those desktop files
        run: |
          pacman -S --noconfirm shared-mime-info
          pacman -Fy
          python3 scripts/check-mimeapps.py --require-file-db
      - name: The tool the wizard uses to switch the theme is shipped by plasma-workspace
        run: |
          if ! pacman -F usr/bin/plasma-apply-lookandfeel | grep -q '/plasma-workspace '; then
            echo "::error::usr/bin/plasma-apply-lookandfeel is not shipped by plasma-workspace"
            pacman -F usr/bin/plasma-apply-lookandfeel || true
            exit 1
          fi
          echo "plasma-workspace ships plasma-apply-lookandfeel"
      - name: The tool the Control Center uses to read the colour scheme is shipped by kconfig
        run: |
          if ! pacman -F usr/bin/kreadconfig6 | grep -q '/kconfig '; then
            echo "::error::usr/bin/kreadconfig6 is not shipped by kconfig"
            pacman -F usr/bin/kreadconfig6 || true
            exit 1
          fi
          echo "kconfig ships kreadconfig6"
      - name: Dock pins exist in Base packages; installer desktop files are consistent
        run: python3 scripts/check-launchers.py --require-file-db
      - name: Menu hide stubs are well formed and still match a shipped entry
        run: python3 scripts/check-menu.py --require-file-db
      - name: GTK integration facts from the package database (informational)
        run: |
          for p in kde-gtk-config breeze-gtk xdg-desktop-portal xdg-desktop-portal-kde xdg-desktop-portal-gtk; do
            echo "=== $p"
            pacman -Si "$p" | grep -E '^(Version|Depends On|Optional Deps)'
            pacman -Fl "$p" | grep -i -E 'gtk|portal|kded|colors|settings' | cut -d' ' -f2 | head -50
          done

  build-packages:
    name: heiss packages build (makepkg) and packaged layout works
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm base-devel git python
      - uses: actions/checkout@v4
      - name: Build all packages with the build script as an unprivileged user
        run: |
          useradd -m builder
          cp -r "$GITHUB_WORKSPACE" /home/builder/src
          chown -R builder /home/builder/src
          su builder -c 'cd /home/builder/src && git config --global --add safe.directory /home/builder/src && LOCALREPO=/home/builder/localrepo bash scripts/heiss-packages-build.sh'
          ls /home/builder/localrepo
      - name: No file of ours is also shipped by an official package
        run: |
          pacman -Fy
          python3 scripts/check-file-conflicts.py /home/builder/localrepo/heiss-*.pkg.tar.zst
      - name: heiss-keyring installs and pacman-key trusts the pinned key
        run: |
          pacman-key --init
          pacman -U --noconfirm /home/builder/localrepo/heiss-keyring-*.pkg.tar.zst
          pacman-key --populate heiss
          pacman-key --finger FEA84CEF8AEDF132
          # field 2 of the pub line is the validity: f (full) or u (ultimate), not q/-/e
          v=$(gpg --homedir /etc/pacman.d/gnupg --list-keys --with-colons DDD292CCC8613FD3324D3833FEA84CEF8AEDF132 | awk -F: '/^pub:/ {print $2; exit}')
          echo "validity=$v"
          case "$v" in f|u) ;; *) echo "::error::the Heiss key is not trusted by pacman-key"; exit 1;; esac
      - name: Inspect packages and run the engine from the extracted packages
        run: |
          cd /home/builder/localrepo
          for p in heiss-*.pkg.tar.zst; do pacman -Qip "$p" | grep -E '^(Name|Version|Depends On)'; done
          mkdir /tmp/x
          bsdtar -xf heiss-core-*.pkg.tar.zst -C /tmp/x
          bsdtar -xf heiss-helper-*.pkg.tar.zst -C /tmp/x
          SP=$(ls -d /tmp/x/usr/lib/python3*/site-packages)
          export PYTHONPATH="$SP"
          python3 -m heiss_core --profiles /tmp/x/usr/share/heiss/profiles profile list
          python3 -m heiss_core --profiles /tmp/x/usr/share/heiss/profiles profile apply --dry-run --profile cyber
          python3 -m heiss_core hw detect --hardware /tmp/x/usr/share/heiss/hardware
          test -f /tmp/x/usr/share/polkit-1/actions/org.heiss.helper.policy
          test -f /tmp/x/usr/share/dbus-1/system.d/org.heiss.Helper1.conf
          test -f /tmp/x/usr/lib/systemd/system/heiss-helper.service

  helper-dbus:
    name: heiss-helper D-Bus glue on a private bus
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm python python-gobject dbus git
      - uses: actions/checkout@v4
      - name: Integration test (private bus, fake polkit and runner)
        run: |
          dbus-uuidgen --ensure
          python3 -m unittest discover -s helper/tests -v

  shortcuts:
    name: keyboard shortcuts have no collisions and the documented table matches the packages
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm python git zstd tar
      - uses: actions/checkout@v4
      - name: Download the Base apps and check their desktop files
        run: |
          mkdir -p /tmp/pk /tmp/sc
          pacman -Sdd -w --noconfirm --cachedir /tmp/pk dolphin konsole kcalc plasma-systemmonitor systemsettings plasma-desktop kate ark gwenview okular spectacle haruna keepassxc filelight partitionmanager
          for f in /tmp/pk/*.pkg.tar.zst; do
            d=/tmp/sc/$(basename "$f" .pkg.tar.zst); mkdir -p "$d"
            tar --zstd -xf "$f" -C "$d" --wildcards 'usr/share/applications/*.desktop'
          done
          python3 scripts/check-shortcuts.py /tmp/sc/*
