name: core

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    name: heiss-core unit tests and manifest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s core/tests -v
      - run: python3 -m unittest discover -s helper/tests -v
      - name: Generated metapackage files are up to date
        run: python3 scripts/gen-profile-packages.py --check
      - name: Manifests load and validate
        run: python3 -m heiss_core --profiles profiles profile list
        env:
          PYTHONPATH: core

  packages-exist:
    name: every manifest package exists (pacman -Si)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm python git
      - uses: actions/checkout@v4
      - run: python3 scripts/check-packages.py
      - name: ISO package list is valid
        run: python3 scripts/check-iso-packages.py

  build-packages:
    name: heiss packages build (makepkg) and packaged layout works
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm base-devel git python
      - uses: actions/checkout@v4
      - name: Build all packages with the build script as an unprivileged user
        run: |
          useradd -m builder
          cp -r "$GITHUB_WORKSPACE" /home/builder/src
          chown -R builder /home/builder/src
          su builder -c 'cd /home/builder/src && git config --global --add safe.directory /home/builder/src && LOCALREPO=/home/builder/localrepo bash scripts/heiss-packages-build.sh'
          ls /home/builder/localrepo
      - name: Inspect packages and run the engine from the extracted packages
        run: |
          cd /home/builder/localrepo
          for p in heiss-*.pkg.tar.zst; do pacman -Qip "$p" | grep -E '^(Name|Version|Depends On)'; done
          mkdir /tmp/x
          bsdtar -xf heiss-core-*.pkg.tar.zst -C /tmp/x
          bsdtar -xf heiss-helper-*.pkg.tar.zst -C /tmp/x
          SP=$(ls -d /tmp/x/usr/lib/python3*/site-packages)
          export PYTHONPATH="$SP"
          python3 -m heiss_core --profiles /tmp/x/usr/share/heiss/profiles profile list
          python3 -m heiss_core --profiles /tmp/x/usr/share/heiss/profiles profile apply --dry-run --profile cyber
          python3 -m heiss_core hw detect --hardware /tmp/x/usr/share/heiss/hardware
          test -f /tmp/x/usr/share/polkit-1/actions/org.heiss.helper.policy
          test -f /tmp/x/usr/share/dbus-1/system.d/org.heiss.Helper1.conf
          test -f /tmp/x/usr/lib/systemd/system/heiss-helper.service

  helper-dbus:
    name: heiss-helper D-Bus glue on a private bus
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm python python-gobject dbus git
      - uses: actions/checkout@v4
      - name: Integration test (private bus, fake polkit and runner)
        run: |
          dbus-uuidgen --ensure
          python3 -m unittest discover -s helper/tests -v
