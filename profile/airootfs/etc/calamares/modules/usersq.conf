# Heiss OS: settings for the QML users page (branding/heiss/usersq.qml).
# Mirrors users.conf (root locked, no autologin) and also sets the hostname,
# because the page asks for the computer name.
---
# [switch] qmlSearch: branding = use usersq.qml from the Heiss branding directory.
# Change to "qrc" to use the stock Calamares page (needs Kirigami, not shipped).
qmlSearch: branding

defaultGroups:
    - users
    - wheel
    - audio
    - video
    - storage
    - optical
    - lp
sudoersGroup: wheel
setRootPassword: false
doAutologin: false
userShell: /bin/bash
setHostname: EtcFile
writeHostsFile: true
