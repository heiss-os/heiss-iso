# Heiss OS: no periodic connectivity probe. The NetworkManager package ships
# /usr/lib/NetworkManager/conf.d/20-connectivity.conf with an HTTP request to
# ping.archlinux.org every few minutes; this file shadows it (same name under /etc).
# Without the probe NetworkManager reports "connected" as soon as a default route
# exists, and captive portals are not detected automatically.
[connectivity]
enabled=false
