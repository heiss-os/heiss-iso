schema_version = 1
id = "essentials"
kind = "profile"
tier = "essential"
name = { en = "Essentials", ru = "Основа" }
description = { en = "The minimum for a usable, secure and good-looking system.", ru = "Минимум для удобной, безопасной и красивой системы." }
packages = [
  "base", "linux", "linux-firmware", "intel-ucode", "amd-ucode", "grub", "os-prober", "efibootmgr", "sudo", "nano",
  "mesa", "xorg-xwayland", "vulkan-radeon", "vulkan-intel",
  "networkmanager", "network-manager-applet", "wireless-regdb",
  "pipewire", "pipewire-pulse", "pipewire-alsa", "wireplumber", "pavucontrol", "alsa-utils",
  "bluez", "bluez-utils", "blueman",
  "hyprland", "waybar", "hyprlock", "hypridle", "swaybg", "fuzzel", "mako", "hyprpolkitagent",
  "xdg-desktop-portal-hyprland", "xdg-desktop-portal-gtk", "grim", "slurp", "wl-clipboard", "brightnessctl",
  "qt6-wayland", "qt6ct", "sddm", "xorg-server",
  "kitty", "thunar", "thunar-volman", "gvfs", "tumbler", "firefox",
  "noto-fonts", "noto-fonts-emoji", "inter-font", "ttf-jetbrains-mono", "ttf-nerd-fonts-symbols-mono",
  "adwaita-icon-theme", "adwaita-cursors", "plymouth",
  "reflector", "zram-generator", "fwupd", "firewalld",
]
services = ["NetworkManager.service", "sddm.service", "bluetooth.service", "firewalld.service", "fstrim.timer"]

[[dropins]]
path = "/etc/systemd/zram-generator.conf.d/heiss.conf"
content = "[zram0]\nzram-size = min(ram / 2, 4096)\n"
