# Heiss OS: Hyprland configuration (placeholder, replace it with your own).
#
# Where this file lives: /usr/share/heiss/desktop/hypr/hyprland.conf is copied to ~/.config/hypr/hyprland.conf
# at the first login and never overwritten afterwards. To use your own configuration, replace that file; the
# only line Heiss needs is the last one (it reads ~/.config/hypr/heiss-user.conf, where Heiss settings write).
#
# Convention for key bindings: every bind line has a comment line with its description directly above it.
# The welcome window reads those pairs, so the list it shows is always the one in this file.

# Heiss colors ($heiss_accent, $heiss_window, ...), switched by `heiss theme`
source = ~/.config/heiss/theme/hypr-colors.conf

# ---- monitors ----
# Automatic: every monitor at its preferred mode, placed from left to right.
monitor = , preferred, auto, 1

# ---- programs ----
$terminal = kitty
$files = thunar
$launcher = fuzzel

# ---- startup ----
exec-once = heiss-wallpaper
exec-once = waybar
exec-once = mako
exec-once = hypridle
exec-once = hyprpolkitagent
exec-once = nm-applet --indicator
exec-once = blueman-applet

# ---- look ----
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = $heiss_accent
    col.inactive_border = $heiss_border
    layout = dwindle
}

decoration {
    rounding = 10
    blur {
        enabled = true
        size = 6
        passes = 2
    }
}

animations {
    enabled = true
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

# ---- input ----
# Keyboard layout and options are set in heiss-user.conf (the installer and the settings window write them).
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

# ---- key bindings ----
$mod = SUPER

# Open the terminal
bind = $mod, Return, exec, $terminal
# Open the file manager
bind = $mod, E, exec, $files
# Open the application launcher
bind = $mod, D, exec, pkill fuzzel || $launcher
# Open the application launcher (second key)
bind = $mod, Space, exec, pkill fuzzel || $launcher
# Close the active window
bind = $mod, Q, killactive
# Toggle fullscreen for the active window
bind = $mod, F, fullscreen
# Toggle floating for the active window
bind = $mod, V, togglefloating
# Lock the screen
bind = $mod, L, exec, hyprlock
# Leave the session
bind = $mod SHIFT, E, exit

# Focus the window on the left
bind = $mod, left, movefocus, l
# Focus the window on the right
bind = $mod, right, movefocus, r
# Focus the window above
bind = $mod, up, movefocus, u
# Focus the window below
bind = $mod, down, movefocus, d

# Move the window to the left
bind = $mod SHIFT, left, movewindow, l
# Move the window to the right
bind = $mod SHIFT, right, movewindow, r
# Move the window up
bind = $mod SHIFT, up, movewindow, u
# Move the window down
bind = $mod SHIFT, down, movewindow, d

# Go to workspace 1
bind = $mod, 1, workspace, 1
# Go to workspace 2
bind = $mod, 2, workspace, 2
# Go to workspace 3
bind = $mod, 3, workspace, 3
# Go to workspace 4
bind = $mod, 4, workspace, 4
# Go to workspace 5
bind = $mod, 5, workspace, 5
# Move the window to workspace 1
bind = $mod SHIFT, 1, movetoworkspace, 1
# Move the window to workspace 2
bind = $mod SHIFT, 2, movetoworkspace, 2
# Move the window to workspace 3
bind = $mod SHIFT, 3, movetoworkspace, 3
# Move the window to workspace 4
bind = $mod SHIFT, 4, movetoworkspace, 4
# Move the window to workspace 5
bind = $mod SHIFT, 5, movetoworkspace, 5

# Move a window with the mouse (hold the key and drag)
bindm = $mod, mouse:272, movewindow
# Resize a window with the mouse (hold the key and drag)
bindm = $mod, mouse:273, resizewindow

# Screenshot of a selected area to the clipboard
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy
# Screenshot of a selected area saved to the Pictures folder
bind = SHIFT, Print, exec, mkdir -p ~/Pictures && grim -g "$(slurp)" ~/Pictures/screenshot-$(date +%Y%m%d-%H%M%S).png

# Raise the volume
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
# Lower the volume
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
# Mute or unmute the sound
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
# Raise the screen brightness
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
# Lower the screen brightness
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# ---- Heiss user settings (keep this line last) ----
source = ~/.config/hypr/heiss-user.conf
