# Heiss OS: lock screen (hyprlock). Replace freely.
source = ~/.config/heiss/theme/hypr-colors.conf

general {
    hide_cursor = true
}

background {
    monitor =
    color = $heiss_view
}

label {
    monitor =
    text = $TIME
    color = $heiss_text
    font_size = 64
    font_family = Inter
    position = 0, 160
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2
    outer_color = $heiss_accent
    inner_color = $heiss_panel
    font_color = $heiss_text
    fail_color = $heiss_negative
    placeholder_text = Password
    position = 0, -40
    halign = center
    valign = center
}
