<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Only root may own the name. Anyone may call: authorization is decided per call by polkit. -->
<busconfig>
  <policy user="root">
    <allow own="org.heiss.Helper1"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.heiss.Helper1" send_interface="org.heiss.Helper1"/>
    <allow send_destination="org.heiss.Helper1" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.heiss.Helper1" send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
